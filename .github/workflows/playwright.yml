name: Playwright + API Tests

on:
  pull_request:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'recruit/**'
      - 'shared/**'           # shared utils change → retest both spaces
      - '.github/workflows/playwright.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL to test against (leave blank to use production URL)'
        required: false
        default: ''

permissions:
  pull-requests: write
  contents: read

# ════════════════════════════════════════════════════════════════════════════
# SHARED WAIT SCRIPT — reused by all three jobs
# Both HF Spaces must be warm before any tests run.
# First-time Docker builds take 7-10 min. 25 × 20s = 8.3 min max wait.
# ════════════════════════════════════════════════════════════════════════════

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # JOB 1 — Playwright E2E Tests (frontend smoke suite)
  # ══════════════════════════════════════════════════════════════════════════
  playwright-tests:
    name: playwright-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Deploy Preview to Vercel
        id: vercel_deploy
        working-directory: frontend
        continue-on-error: true
        run: |
          DEPLOY_URL=$(npx vercel deploy \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --yes \
            2>&1 | grep -E "^https://" | tail -1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "⚠️ Vercel preview deploy failed — will fall back to production URL"
          else
            echo "✅ Preview: $DEPLOY_URL"
            echo "PREVIEW_URL=$DEPLOY_URL" >> $GITHUB_OUTPUT
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Set test URL
        id: set_url
        run: |
          if [ -n "${{ github.event.inputs.base_url }}" ]; then
            URL="${{ github.event.inputs.base_url }}"
          elif [ -n "${{ steps.vercel_deploy.outputs.PREVIEW_URL }}" ]; then
            URL="${{ steps.vercel_deploy.outputs.PREVIEW_URL }}"
          else
            URL="https://jmdata-crm-application.jmdatatalent.com"
          fi
          echo "TEST_URL=$URL" >> $GITHUB_OUTPUT
          echo "🧪 Testing against: $URL"

      # Wait for BOTH spaces — Playwright tests need candidates (Recruit) + login (Core)
      - name: Wait for Core + Recruit backends
        run: |
          wait_for() {
            local NAME=$1
            local URL=$2
            echo "⏳ Waiting for $NAME..."
            for i in $(seq 1 25); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --max-time 15 || echo "000")
              echo "  Attempt $i: HTTP $STATUS"
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
                echo "  ✅ $NAME is warm"
                return 0
              fi
              sleep 20
            done
            echo "  ⚠️ $NAME did not respond after 25 attempts — continuing anyway"
            return 0
          }
          wait_for "Core"    "https://freddy-jmdataai-nexus-crm-backend.hf.space/api/auth/me"
          wait_for "Recruit" "https://freddy-jmdataai-nexus-crm-recruit.hf.space/health"

      - name: Create auth directory
        run: mkdir -p frontend/tests/playwright/.auth

      - name: Run Playwright Tests
        working-directory: frontend
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.set_url.outputs.TEST_URL }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Post result comment to PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const passed = '${{ job.status }}' === 'success';
            const emoji  = passed ? '✅' : '❌';
            const status = passed ? 'All tests passed' : 'Tests FAILED — merge blocked';
            const url    = '${{ steps.set_url.outputs.TEST_URL }}';
            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body:
                `## ${emoji} Playwright Tests — ${status}\n\n` +
                `**URL tested:** ${url}\n\n` +
                (passed
                  ? '✅ All smoke tests passed. Safe to merge.'
                  : '❌ One or more tests failed. Download the **playwright-report** artifact above for screenshots.\n\n**Do not merge until fixed.**')
            });

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 2 — Core Backend API Tests (backend_test.py → Core HF Space)
  # ══════════════════════════════════════════════════════════════════════════
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Wait for Core backend
        run: |
          echo "⏳ Waiting for Core space..."
          for i in $(seq 1 25); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://freddy-jmdataai-nexus-crm-backend.hf.space/api/auth/me \
              --max-time 15 || echo "000")
            echo "  Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
              echo "  ✅ Core is warm"
              break
            fi
            sleep 20
          done

      - name: Run Core API Tests
        run: |
          python backend/backend_test.py \
            https://freddy-jmdataai-nexus-crm-backend.hf.space
        env:
          ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

      - name: Post backend test summary to PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const passed = '${{ job.status }}' === 'success';
            const emoji  = passed ? '✅' : '❌';
            const status = passed ? 'All Core endpoints passed' : 'Core backend tests FAILED';
            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body:
                `## ${emoji} Core Backend Tests — ${status}\n\n` +
                (passed
                  ? '✅ All Core API endpoints responded correctly.'
                  : '❌ One or more Core endpoints failed. Check the **backend-tests** job logs.')
            });

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 3 — Recruit API Tests (recruit_test.py → Recruit HF Space)
  # ══════════════════════════════════════════════════════════════════════════
  recruit-tests:
    name: recruit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # Recruit tests log into Core first — wait for both
      - name: Wait for Core + Recruit backends
        run: |
          wait_for() {
            local NAME=$1
            local URL=$2
            echo "⏳ Waiting for $NAME..."
            for i in $(seq 1 25); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --max-time 15 || echo "000")
              echo "  Attempt $i: HTTP $STATUS"
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
                echo "  ✅ $NAME is warm"
                return 0
              fi
              sleep 20
            done
            echo "  ⚠️ $NAME did not respond — continuing anyway"
            return 0
          }
          wait_for "Core"    "https://freddy-jmdataai-nexus-crm-backend.hf.space/api/auth/me"
          wait_for "Recruit" "https://freddy-jmdataai-nexus-crm-recruit.hf.space/health"

      - name: Run Recruit API Tests
        run: |
          python recruit/recruit_test.py \
            https://freddy-jmdataai-nexus-crm-recruit.hf.space
        env:
          ADMIN_EMAIL:  ${{ secrets.TEST_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          CORE_URL: https://freddy-jmdataai-nexus-crm-backend.hf.space

      - name: Post recruit test summary to PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const passed = '${{ job.status }}' === 'success';
            const emoji  = passed ? '✅' : '❌';
            const status = passed ? 'All Recruit endpoints passed' : 'Recruit backend tests FAILED';
            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body:
                `## ${emoji} Recruit Backend Tests — ${status}\n\n` +
                (passed
                  ? '✅ All Recruit API endpoints responded correctly.'
                  : '❌ One or more Recruit endpoints failed. Check the **recruit-tests** job logs.')
            });
