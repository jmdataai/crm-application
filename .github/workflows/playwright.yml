name: Playwright Tests

on:
  pull_request:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/playwright.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL to test against (leave blank to use production URL)'
        required: false
        default: ''

# ── FIX: grant permission to post PR comments ─────────────────────────────────
permissions:
  pull-requests: write
  contents: read

jobs:
  playwright-tests:
    name: playwright-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node ───────────────────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      # ── 3. Install deps ───────────────────────────────────────────────────
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      # ── 4. Playwright browser ─────────────────────────────────────────────
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      # ── 5. Deploy preview to Vercel (if token is configured) ──────────────
      #    If VERCEL_TOKEN secret is not set yet, this step is skipped
      #    and tests fall back to the production URL automatically.
      - name: Deploy Preview to Vercel
        id: vercel_deploy
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        working-directory: frontend
        continue-on-error: true   # don't block tests if preview deploy fails
        run: |
          DEPLOY_URL=$(npx vercel deploy \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --yes \
            2>&1 | grep -E "^https://" | tail -1)

          if [ -z "$DEPLOY_URL" ]; then
            echo "⚠️ Vercel preview deploy failed — will fall back to production URL"
          else
            echo "✅ Preview: $DEPLOY_URL"
            echo "PREVIEW_URL=$DEPLOY_URL" >> $GITHUB_OUTPUT
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── 6. Determine test URL ─────────────────────────────────────────────
      #    Priority: manual input → Vercel preview → production URL
      - name: Set test URL
        id: set_url
        run: |
          if [ -n "${{ github.event.inputs.base_url }}" ]; then
            URL="${{ github.event.inputs.base_url }}"
          elif [ -n "${{ steps.vercel_deploy.outputs.PREVIEW_URL }}" ]; then
            URL="${{ steps.vercel_deploy.outputs.PREVIEW_URL }}"
          else
            URL="https://jmdata-crm-application.jmdatatalent.com"
          fi
          echo "TEST_URL=$URL" >> $GITHUB_OUTPUT
          echo "🧪 Testing against: $URL"

      # ── 7. Wait for HuggingFace backend to wake up ────────────────────────
      - name: Wait for backend health
        run: |
          echo "Pinging backend..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://freddy-jmdataai-nexus-crm-backend.hf.space/api/auth/me \
              --max-time 10 || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
              echo "✅ Backend is warm"
              break
            fi
            sleep 15
          done

      # ── 8. Auth directory ─────────────────────────────────────────────────
      - name: Create auth directory
        run: mkdir -p frontend/tests/playwright/.auth

      # ── 9. Run Playwright tests ───────────────────────────────────────────
      - name: Run Playwright Tests
        working-directory: frontend
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.set_url.outputs.TEST_URL }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

      # ── 10. Upload report (always runs even on failure) ───────────────────
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      # ── 11. Post result comment to PR ─────────────────────────────────────
      - name: Post test summary to PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true   # never fail the job just because of a comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const passed  = '${{ job.status }}' === 'success';
            const emoji   = passed ? '✅' : '❌';
            const status  = passed ? 'All tests passed' : 'Tests FAILED — merge blocked';
            const url     = '${{ steps.set_url.outputs.TEST_URL }}';

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body:
                `## ${emoji} Playwright Tests — ${status}\n\n` +
                `**URL tested:** ${url}\n\n` +
                (passed
                  ? '✅ All smoke tests passed. Safe to merge.'
                  : '❌ One or more tests failed. Download the **playwright-report** artifact above for screenshots.\n\n**Do not merge until fixed.**')
            });
